<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Bit Open World Drive</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated; /* Keeps it chunky */
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            text-shadow: 2px 2px 0px #000;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #555;
        }
        h2 { margin: 0 0 5px 0; color: #ffeb3b; }
        p { margin: 5px 0; font-size: 14px; }
        .legend span { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: middle; }
        #hud {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid #4CAF50;
            pointer-events: none;
            font-size: 18px;
            font-weight: bold;
        }
        .hud-row { margin: 5px 0; }
        .hud-val { color: #00ff00; font-family: monospace; float: right; margin-left: 20px; }
        #leaderboard {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid #ffeb3b;
            pointer-events: none;
            font-size: 14px;
            min-width: 160px;
        }
        .lb-title { text-align: center; color: #ffeb3b; font-weight: bold; margin-bottom: 10px; font-size: 16px; text-shadow: 1px 1px 0 #000; }
        .lb-row { margin: 4px 0; clear: both; overflow: hidden; }
        .lb-name { font-weight: bold; float: left; text-shadow: 1px 1px 0 #000; }
        .lb-score { color: #00ff00; font-family: monospace; float: right; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Retro Drive</h2>
        <p><b>Arrows:</b> Drive & Steer</p>
        <p class="legend"><span style="background: #ff8800;"></span> Jump Ramp</p>
        <p class="legend"><span style="background: #8b4513;"></span> Destructible Crate</p>
        <p class="legend"><span style="background: #777;"></span> Solid Wall</p>
        <p class="legend"><span style="background: #4a3320; border-radius: 50%;"></span> Mud Puddle</p>
        <p class="legend"><span style="background: #2196F3;"></span> NPC Cars</p>
    </div>

    <!-- New HUD Element -->
    <div id="hud">
        <div class="hud-row">SCORE: <span id="hud-score" class="hud-val">0</span></div>
        <div class="hud-row">HEALTH: <span id="hud-health" class="hud-val">100</span></div>
        <div class="hud-row">SPEED: <span id="hud-speed" class="hud-val">0.0</span></div>
        <div class="hud-row">TOP SPEED: <span id="hud-maxspeed" class="hud-val">10.0</span></div>
        <div class="hud-row">CRATES: <span id="hud-crates" class="hud-val">0</span></div>
    </div>

    <!-- New Leaderboard Element -->
    <div id="leaderboard">
        <div class="lb-title">TOP 5 SCORERS</div>
        <div id="lb-content"></div>
    </div>

    <!-- Multiplayer UI Additions -->
    <div id="loading" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #222; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;">
        <h1 style="color: #ffeb3b; font-family: 'Courier New'; font-size: 48px; text-shadow: 4px 4px 0 #000;">RETRO DRIVE ONLINE</h1>
        <p style="color: #fff; font-family: 'Courier New'; font-size: 20px;">Connecting to Server...</p>
    </div>

    <div id="network-panel" style="position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.8); padding: 10px 15px; border-radius: 8px; border: 2px solid #2196F3; font-weight: bold; text-shadow: 1px 1px 0 #000;">
        <span id="network-status" style="color: #aaaaaa;">🌐 CONNECTING...</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = false; 
        }
        window.addEventListener('resize', resize);
        resize();

        // Input
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Multiplayer Variables
        let isHost = false;
        let userId = null;
        let otherPlayers = {};
        let db, auth;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let lastHostUpdate = Date.now(); // Tracks when the host last sent data
        const hostMigrationTimeout = 3000 + Math.random() * 2000; // Staggered takeover timer

        // World setup
        const worldSize = 2500;
        const worldObjects = [];
        const npcs = [];
        const particles = [];
        const floatingTexts = []; // Array to hold floating text animations
        const skidMarks = []; // Array to hold tire skid marks

        function createExplosion(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    decay: Math.random() * 0.02 + 0.01,
                    color: Math.random() > 0.5 ? '#ff8800' : '#ff0000',
                    size: Math.random() * 5 + 2
                });
            }
        }

        function addFloatingText(x, y, text, color, customLife = 60) {
            floatingTexts.push({
                x: x,
                y: y - 20, // Start slightly above the car
                text: text,
                color: color,
                life: customLife, // Variable duration
                maxLife: customLife
            });
        }

        function spawnSkidMarks(c) {
            // Find the position of the rear wheels
            let backX = c.x - Math.cos(c.angle) * (c.width / 2 - 4);
            let backY = c.y - Math.sin(c.angle) * (c.width / 2 - 4);
            
            // Calculate left and right wheel offsets
            let leftX = backX + Math.cos(c.angle - Math.PI / 2) * (c.height / 2 - 4);
            let leftY = backY + Math.sin(c.angle - Math.PI / 2) * (c.height / 2 - 4);
            
            let rightX = backX + Math.cos(c.angle + Math.PI / 2) * (c.height / 2 - 4);
            let rightY = backY + Math.sin(c.angle + Math.PI / 2) * (c.height / 2 - 4);

            skidMarks.push({
                x1: leftX, y1: leftY,
                x2: rightX, y2: rightY,
                life: 150, // Fades over ~2.5 seconds
                maxLife: 150
            });
        }

        // Stats tracking
        let playerStats = { crashes: 0, cratesSmashed: 0, jumps: 0, healthCrates: 0, speedCrates: 0, sadCrates: 0 };
        
        // HUD DOM Elements
        const hudScore = document.getElementById('hud-score');
        const hudHealth = document.getElementById('hud-health');
        const hudSpeed = document.getElementById('hud-speed');
        const hudMaxSpeed = document.getElementById('hud-maxspeed');
        const hudCrates = document.getElementById('hud-crates');

        // Player Car
        const playerColors = ['#cc0000', '#00cc00', '#0000cc', '#e6e600', '#ff6600', '#ff00ff'];
        const car = {
            x: (Math.random() - 0.5) * worldSize * 2, 
            y: (Math.random() - 0.5) * worldSize * 2,
            vx: 0, vy: 0,
            angle: -Math.PI / 2, 
            z: 0, vz: 0,
            width: 32, height: 20,
            radius: 14,
            maxSpeed: 10,
            accel: 0.4,
            friction: 0.92,
            turnSpeed: 0.08,
            color: playerColors[Math.floor(Math.random() * playerColors.length)],
            health: 100,
            dead: false,
            deadTimer: 0,
            mudTimer: 0, 
            score: 0,
            name: 'P' + Math.floor(Math.random() * 9999)
        };

        // Initialize World (Only called by Host)
        function initWorld() {
            // Generate Mud Puddles
            for (let i = 0; i < 150; i++) {
                worldObjects.push({
                    x: (Math.random() - 0.5) * worldSize * 2,
                    y: (Math.random() - 0.5) * worldSize * 2,
                    type: 'puddle',
                    color: '#4a3320', 
                    radius: 30 + Math.random() * 50, // Varying size (30 to 80 radius)
                    active: true,
                    respawnTimer: 0
                });
            }

            // Generate Obstacles
            for (let i = 0; i < 400; i++) {
                let typeRandom = Math.random();
                let type = 'indestructible';
                let color = '#777'; 
                let radius = 20 + Math.random() * 10;

                if (typeRandom > 0.8) {
                    type = 'jump';
                    color = '#ff8800'; 
                    radius = 25;
                } else if (typeRandom > 0.5) {
                    type = 'destructible';
                    color = '#8b4513'; 
                    radius = 16;
                }

                worldObjects.push({
                    x: (Math.random() - 0.5) * worldSize * 2,
                    y: (Math.random() - 0.5) * worldSize * 2,
                    type: type,
                    color: color,
                    radius: radius,
                    active: true,
                    respawnTimer: 0
                });
            }

            // Generate NPC Cars
            const npcColors = ['#2196F3', '#9C27B0', '#009688', '#FFEB3B', '#FF9800'];
            for (let i = 0; i < 40; i++) {
                npcs.push({
                    x: (Math.random() - 0.5) * worldSize * 2,
                    y: (Math.random() - 0.5) * worldSize * 2,
                    vx: 0, vy: 0,
                    angle: Math.random() * Math.PI * 2,
                    targetAngle: 0,
                    z: 0, vz: 0,
                    width: 30, height: 18,
                    radius: 14,
                    speed: 8 + Math.random() * 4, // Higher max speed to fight friction
                    accel: 0.3 + Math.random() * 0.2, // Individual acceleration
                    friction: 0.92, // Same road friction as player
                    color: npcColors[Math.floor(Math.random() * npcColors.length)],
                    timer: 0,
                    health: 100,
                    dead: false,
                    deadTimer: 0,
                    mudTimer: 0, // New property for NPC mud effect
                    cratesSmashed: 0,
                    healthCrates: 0,
                    speedCrates: 0,
                    sadCrates: 0,
                    score: 0,
                    name: 'NPC ' + (i + 1),
                    evadeTimer: 0
                });
            }
        }

        // Generic Car Drawing Function
        function drawCarObject(c) {
            ctx.save();
            ctx.translate(c.x, c.y);
            
            // Draw Health Bar
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(-15, -c.height/2 - c.z - 10, 30, 4);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(-15, -c.height/2 - c.z - 10, 30 * (c.health / 100), 4);

            // Draw Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.save();
            ctx.rotate(c.angle);
            ctx.fillRect(-c.width/2 + c.z/2, -c.height/2 + c.z/2, c.width, c.height);
            ctx.restore();

            // Simulate Jump Height
            let scale = 1 + (c.z * 0.015);
            ctx.scale(scale, scale);
            ctx.rotate(c.angle);

            // Name Tag & Leader Icon
            ctx.save();
            ctx.rotate(-c.angle); // Un-rotate to draw text upright
            
            if (c.isLeader) {
                ctx.font = "32px Arial"; // Bigger crown
                ctx.textAlign = "center";
                
                // Black outline/shadow for high visibility
                ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                
                // Add an exaggerated smooth bouncing animation to the crown
                let bounce = Math.sin(Date.now() / 150) * 6;
                ctx.fillText("👑", 0, -c.height/2 - c.z - 45 + bounce);
                
                // Reset shadow so it doesn't affect the name tag
                ctx.shadowColor = "transparent";
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
            }

            if (c.name) {
                ctx.fillStyle = c === car ? "#00ff00" : "#ffffff";
                if (c.name.startsWith("NPC")) ctx.fillStyle = "#aaaaaa";
                ctx.font = "bold 12px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText(c.name, 0, -c.height/2 - c.z - 25);
            }
            ctx.restore();

            // Car Body
            ctx.fillStyle = c.color;
            ctx.fillRect(-c.width / 2, -c.height / 2, c.width, c.height);
            
            // Roof
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(-c.width / 4, -c.height / 2 + 2, c.width / 2, c.height - 4);
            
            // Windshield (facing right)
            ctx.fillStyle = '#00ccff';
            ctx.fillRect(c.width / 4, -c.height / 2 + 3, 6, c.height - 6);
            
            // Rear window
            ctx.fillStyle = '#111';
            ctx.fillRect(-c.width / 4 - 4, -c.height / 2 + 4, 4, c.height - 8);

            // Headlights
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(c.width / 2 - 4, -c.height / 2 + 1, 4, 4);
            ctx.fillRect(c.width / 2 - 4, c.height / 2 - 5, 4, 4);

            ctx.restore();
        }

        // --- MULTIPLAYER SYNC FUNCTIONS ---

        function sanitizePlayer(p) {
            return {
                x: Math.round(p.x), y: Math.round(p.y), vx: p.vx || 0, vy: p.vy || 0, angle: p.angle || 0, z: p.z || 0,
                health: p.health || 0, dead: p.dead || false, score: p.score || 0, name: p.name || 'Player', color: p.color || '#fff',
                width: 32, height: 20, radius: 14, maxSpeed: p.maxSpeed || 10,
                timestamp: Date.now() // Stamped at exact moment of broadcast
            };
        }

        function sanitizeNPCs(npcsArr) {
            return npcsArr.map(n => ({
                x: Math.round(n.x), y: Math.round(n.y), vx: n.vx || 0, vy: n.vy || 0, angle: n.angle || 0, targetAngle: n.targetAngle || 0, z: n.z || 0,
                health: n.health || 0, dead: n.dead || false, score: n.score || 0, name: n.name || 'NPC', color: n.color || '#fff',
                mudTimer: n.mudTimer || 0, timer: n.timer || 0, evadeTimer: n.evadeTimer || 0,
                width: 30, height: 18, radius: 14, speed: n.speed || 5
            }));
        }

        let isMapSyncing = false;
        let mapSyncPending = false;

        function syncMap() {
            if (isMapSyncing) {
                mapSyncPending = true;
                return Promise.resolve();
            }
            isMapSyncing = true;
            mapSyncPending = false;

            const mapRef = doc(db, 'artifacts', appId, 'public', 'data', 'world', 'map_state');
            // Explicitly map object values to avoid undefined fields breaking Firestore
            const sanitizedObjects = worldObjects.map(obj => ({
                x: obj.x, y: obj.y, type: obj.type, color: obj.color, radius: obj.radius,
                active: obj.active ?? true, respawnTimer: obj.respawnTimer || 0
            }));
            
            return setDoc(mapRef, { objects: sanitizedObjects })
                .then(() => {
                    isMapSyncing = false;
                    if (mapSyncPending) syncMap();
                })
                .catch(e => {
                    console.error(e);
                    isMapSyncing = false;
                });
        }

        let frameCount = 0;
        let isPlayerSyncing = false;
        let isNpcSyncing = false;

        function update() {
            frameCount++;
            
            // --- PARTICLES & TEXTS ---
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1; ft.life--;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }
            for (let i = skidMarks.length - 1; i >= 0; i--) {
                skidMarks[i].life--;
                if (skidMarks[i].life <= 0) skidMarks.splice(i, 1);
            }

            // Cull Disconnected Players (check internal timestamp, not local lastSeen)
            let now = Date.now();
            for (let id in otherPlayers) {
                if (now - (otherPlayers[id].timestamp || 0) > 5000) {
                    delete otherPlayers[id];
                }
            }

            // --- HOST MIGRATION ---
            // If the host leaves, the AI stops. This allows a client to dynamically take over!
            if (!isHost && (now - lastHostUpdate > hostMigrationTimeout)) {
                isHost = true;
                document.getElementById('network-status').innerText = "🌐 HOST (MIGRATED)";
                document.getElementById('network-status').style.color = "#ffeb3b";
            }

            // --- MULTIPLAYER BROADCAST ---
            // Broadcast player state and Host NPC state at 5 ticks per second (every 12 frames)
            if (frameCount % 12 === 0 && userId) {
                if (!isPlayerSyncing) {
                    isPlayerSyncing = true;
                    const pRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', userId);
                    setDoc(pRef, sanitizePlayer(car)).finally(() => { isPlayerSyncing = false; });
                }

                if (isHost && !isNpcSyncing) {
                    isNpcSyncing = true;
                    const npcRef = doc(db, 'artifacts', appId, 'public', 'data', 'world', 'npc_state');
                    setDoc(npcRef, { npcs: sanitizeNPCs(npcs) }).finally(() => { isNpcSyncing = false; });
                }
            }

            // --- CRATE RESPAWNS (HOST ONLY) ---
            if (isHost) {
                let mapChanged = false;
                for (let obj of worldObjects) {
                    if (!obj.active && obj.type === 'destructible') {
                        if (obj.respawnTimer > 0) obj.respawnTimer--;
                        else {
                            obj.active = true;
                            mapChanged = true;
                        }
                    }
                }
                if (mapChanged) syncMap(); // Broadcast respawns to all clients
            }

            // --- PLAYER DEATH & RESPAWN ---
            if (car.health <= 0 && !car.dead) {
                car.dead = true;
                car.deadTimer = 300;
                car.vx = 0; car.vy = 0;
                car.score = Math.max(0, car.score - 500); 
                addFloatingText(car.x, car.y - 15, "-500 PTS", "#ff0000");
                createExplosion(car.x, car.y);
            }
            if (car.dead) {
                car.deadTimer--;
                if (car.deadTimer <= 0) {
                    car.dead = false; car.health = 100; car.mudTimer = 0;
                    car.x = (Math.random() - 0.5) * worldSize * 2;
                    car.y = (Math.random() - 0.5) * worldSize * 2;
                }
            }

            // --- PLAYER PHYSICS & MOVEMENT ---
            if (car.mudTimer > 0) car.mudTimer--;
            if (car.z === 0 && !car.dead) {
                let healthFactor = 0.3 + 0.7 * (car.health / 100);
                let mudFactor = car.mudTimer > 0 ? 0.5 : 1.0; 
                let currentAccel = car.accel * healthFactor * mudFactor;
                let currentTurnSpeed = car.turnSpeed * healthFactor * mudFactor;
                let currentMaxSpeed = car.maxSpeed * healthFactor * mudFactor;

                if (keys.ArrowUp) { car.vx += Math.cos(car.angle) * currentAccel; car.vy += Math.sin(car.angle) * currentAccel; }
                if (keys.ArrowDown) { car.vx -= Math.cos(car.angle) * (currentAccel * 0.6); car.vy -= Math.sin(car.angle) * (currentAccel * 0.6); }

                let speed = Math.hypot(car.vx, car.vy);
                if (speed > 0.5) {
                    let isReversing = (keys.ArrowDown && !keys.ArrowUp && speed > 1);
                    let dir = isReversing ? -1 : 1; 
                    if (keys.ArrowLeft) car.angle -= currentTurnSpeed * dir;
                    if (keys.ArrowRight) car.angle += currentTurnSpeed * dir;
                }

                car.vx *= car.friction; car.vy *= car.friction;
                let currentSpeed = Math.hypot(car.vx, car.vy);
                if (currentSpeed > currentMaxSpeed) {
                    car.vx = (car.vx / currentSpeed) * currentMaxSpeed;
                    car.vy = (car.vy / currentSpeed) * currentMaxSpeed;
                }

                let isTurning = keys.ArrowLeft || keys.ArrowRight;
                let achievableTopSpeed = (currentAccel * car.friction) / (1 - car.friction);
                let effectiveTopSpeed = Math.min(currentMaxSpeed, achievableTopSpeed);
                
                if (isTurning && currentSpeed > effectiveTopSpeed * 0.87 && car.mudTimer <= 0) {
                    spawnSkidMarks(car);
                }
            }

            car.x += car.vx; car.y += car.vy;

            if (car.z > 0 || car.vz > 0) {
                car.vz -= 0.6; car.z += car.vz;
                if (car.z < 0) { car.z = 0; car.vz = 0; }
            }

            // --- LEADERBOARD & HUD ---
            hudScore.innerText = car.score;
            if (car.dead) {
                hudHealth.innerText = "0"; hudHealth.style.color = "#ff0000"; hudSpeed.innerText = "0.0";
            } else {
                hudHealth.innerText = Math.floor(car.health);
                if (car.health > 60) hudHealth.style.color = "#00ff00";
                else if (car.health > 25) hudHealth.style.color = "#ffff00";
                else hudHealth.style.color = "#ff0000";
                hudSpeed.innerText = Math.hypot(car.vx, car.vy).toFixed(1);
            }
            hudMaxSpeed.innerText = car.maxSpeed.toFixed(1);
            hudCrates.innerText = playerStats.cratesSmashed;

            let allCars = [car, ...Object.values(otherPlayers), ...npcs];
            if (frameCount % 15 === 0) {
                let sortedCars = [...allCars].sort((a, b) => b.score - a.score); 
                let top5 = sortedCars.slice(0, 5);
                let lbHtml = '';
                top5.forEach((c, index) => {
                    let color = c === car ? '#00ff00' : (c.color || '#fff');
                    lbHtml += `<div class="lb-row"><span class="lb-name" style="color: ${color}">${index + 1}. ${c.name}</span> <span class="lb-score">${c.score}</span></div>`;
                });
                document.getElementById('lb-content').innerHTML = lbHtml;
            }

            // --- NPC AI & MOVEMENT ---
            let aliveCars = allCars.filter(c => !c.dead);
            let leader = null;
            if (aliveCars.length > 0) {
                let maxScorer = aliveCars.reduce((max, c) => c.score > max.score ? c : max, aliveCars[0]);
                if (maxScorer.score > 0) leader = maxScorer; 
            }

            // Mark the leader so we can render the crown
            allCars.forEach(c => c.isLeader = false);
            if (leader) leader.isLeader = true;

            for (let npc of npcs) {
                // Host handles Death Timers & AI Evasion
                if (isHost) {
                    if (npc.health <= 0 && !npc.dead) {
                        npc.dead = true; npc.deadTimer = 300; npc.vx = 0; npc.vy = 0;
                        npc.score = Math.max(0, npc.score - 500); 
                        createExplosion(npc.x, npc.y);
                    }
                    if (npc.dead) {
                        npc.deadTimer--;
                        if (npc.deadTimer <= 0) {
                            npc.dead = false; npc.health = 100; npc.mudTimer = 0;
                            npc.x = (Math.random() - 0.5) * worldSize * 2;
                            npc.y = (Math.random() - 0.5) * worldSize * 2;
                        }
                        continue; 
                    }
                    if (npc.mudTimer > 0) npc.mudTimer--;
                    if (npc.evadeTimer > 0) npc.evadeTimer--;

                    let npcHealthFactor = 0.3 + 0.7 * (npc.health / 100);
                    let npcMudFactor = npc.mudTimer > 0 ? 0.5 : 1.0;

                    if (npc.z === 0) {
                        if (npc.evadeTimer <= 0) {
                            let hx = npc.x + Math.cos(npc.angle) * 70;
                            let hy = npc.y + Math.sin(npc.angle) * 70;
                            for (let obj of worldObjects) {
                                if (!obj.active || (obj.type !== 'indestructible' && obj.type !== 'puddle')) continue;
                                if (Math.hypot(hx - obj.x, hy - obj.y) < obj.radius + npc.radius + 10) {
                                    npc.evadeTimer = 45; 
                                    if (Math.random() < 0.5) { 
                                        let angleToObj = Math.atan2(obj.y - npc.y, obj.x - npc.x);
                                        let evadeDir = Math.sin(npc.angle - angleToObj) > 0 ? 1 : -1; 
                                        npc.targetAngle = npc.angle + evadeDir * (Math.PI / 2); 
                                        npc.timer = 40; 
                                    }
                                    break; 
                                }
                            }
                        }

                        npc.timer--;
                        if (npc.timer <= 0) {
                            if (leader && leader !== npc) {
                                let absoluteTargetAngle = Math.atan2(leader.y - npc.y, leader.x - npc.x);
                                let diff = absoluteTargetAngle - (npc.angle % (Math.PI * 2));
                                if (diff > Math.PI) diff -= Math.PI * 2;
                                if (diff < -Math.PI) diff += Math.PI * 2;
                                npc.targetAngle = npc.angle + diff + (Math.random() - 0.5) * 0.5;
                                npc.timer = 15 + Math.random() * 20; 
                            } else {
                                npc.targetAngle = npc.angle + (Math.random() - 0.5) * 2; 
                                npc.timer = 30 + Math.random() * 60; 
                            }
                        }

                        let angleDiff = npc.targetAngle - npc.angle;
                        npc.angle += angleDiff * (0.05 * npcHealthFactor * npcMudFactor);
                        let currentAccel = npc.accel * npcHealthFactor * npcMudFactor;
                        npc.vx += Math.cos(npc.angle) * currentAccel;
                        npc.vy += Math.sin(npc.angle) * currentAccel;
                        npc.vx *= npc.friction; npc.vy *= npc.friction;

                        let currentMaxSpeed = npc.speed * npcHealthFactor * npcMudFactor;
                        let currentSpeed = Math.hypot(npc.vx, npc.vy);
                        if (currentSpeed > currentMaxSpeed) {
                            npc.vx = (npc.vx / currentSpeed) * currentMaxSpeed;
                            npc.vy = (npc.vy / currentSpeed) * currentMaxSpeed;
                        }
                    }
                } else {
                    if (npc.dead) continue; // Clients skip AI calculation for dead NPCs
                }

                // All clients process raw movement and skid marks so it stays smooth
                npc.x += npc.vx;
                npc.y += npc.vy;

                if (npc.z === 0) {
                    let npcSpeed = Math.hypot(npc.vx, npc.vy);
                    let healthMod = 0.3 + 0.7 * (npc.health / 100);
                    let mudMod = npc.mudTimer > 0 ? 0.5 : 1.0;
                    let achievableTopSpeed = ((npc.accel * healthMod * mudMod) * npc.friction) / (1 - npc.friction);
                    let effectiveTopSpeed = Math.min(npc.speed * healthMod * mudMod, achievableTopSpeed);
                    
                    let normDiff = Math.abs((npc.targetAngle - npc.angle) % (Math.PI * 2));
                    if (normDiff > Math.PI) normDiff = Math.PI * 2 - normDiff;
                    
                    if (normDiff > 0.05 && npcSpeed > effectiveTopSpeed * 0.95 && npc.mudTimer <= 0) {
                        spawnSkidMarks(npc);
                    }
                }

                if (npc.z > 0 || npc.vz > 0) {
                    npc.vz -= 0.6; npc.z += npc.vz;
                    if (npc.z < 0) { npc.z = 0; npc.vz = 0; }
                }
                
                if (npc.x > worldSize) npc.x = -worldSize;
                if (npc.x < -worldSize) npc.x = worldSize;
                if (npc.y > worldSize) npc.y = -worldSize;
                if (npc.y < -worldSize) npc.y = worldSize;
            }

            // --- COLLISIONS ---
            
            // 1. Player vs World Objects (All clients evaluate and sync independently)
            if (car.z === 0 && !car.dead) {
                for (let obj of worldObjects) {
                    if (!obj.active) continue;
                    let dx = car.x - obj.x; let dy = car.y - obj.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist < car.radius + obj.radius) {
                        if (obj.type === 'puddle') {
                            if (car.mudTimer <= 0) addFloatingText(car.x, car.y, "MUD!", "#4a3320");
                            car.mudTimer = 420; 
                        } else if (obj.type === 'jump') {
                            car.vz = 9; playerStats.jumps++; car.score += 100;
                            addFloatingText(car.x, car.y - 15, "+100 PTS", "#ffff00");
                            let oldHealth = car.health;
                            car.health = Math.min(100, car.health + 1);
                            if (car.health > oldHealth) addFloatingText(car.x, car.y, "+1 HP", "#00ff00");
                        } else if (obj.type === 'destructible') {
                            obj.active = false; obj.respawnTimer = 600; 
                            syncMap(); // Sync crate destruction to everyone!
                            car.vx *= 0.5; car.vy *= 0.5;
                            playerStats.cratesSmashed++; car.score += 50;
                            addFloatingText(car.x, car.y - 15, "+50 PTS", "#ffff00");

                            let r = Math.random();
                            if (r < 0.17) {
                                let hpBoost = Math.floor(Math.random() * 6) + 10;
                                let oldHealth = car.health; car.health = Math.min(100, car.health + hpBoost);
                                if (car.health > oldHealth) addFloatingText(car.x, car.y, "+" + (car.health - oldHealth) + " HP", "#00ff00");
                            } else if (r < 0.25) { 
                                car.maxSpeed *= 1.1; car.accel *= 1.1; addFloatingText(car.x, car.y, "+SPEED", "#00ffff");
                            } else { 
                                addFloatingText(car.x, car.y, "😢", "#aaaaaa", 180);
                            }
                        } else if (obj.type === 'indestructible') {
                            car.x += (dx / dist) * 5; car.y += (dy / dist) * 5;
                            car.vx *= -0.5; car.vy *= -0.5;
                            let oldHealth = car.health; car.health = Math.max(0, car.health - 7);
                            if (car.health < oldHealth) addFloatingText(car.x, car.y, "-7 HP", "#ff0000");
                        }
                    }
                }
            }

            // 2. NPCs vs World Objects (Host only evaluates this)
            if (isHost) {
                for (let npc of npcs) {
                    if (npc.z !== 0 || npc.dead) continue;
                    for (let obj of worldObjects) {
                        if (!obj.active) continue;
                        let dx = npc.x - obj.x; let dy = npc.y - obj.y;
                        let dist = Math.hypot(dx, dy);

                        if (dist < npc.radius + obj.radius) {
                            if (obj.type === 'puddle') {
                                npc.mudTimer = 420;
                            } else if (obj.type === 'jump') {
                                npc.vz = 7; npc.score += 100; npc.health = Math.min(100, npc.health + 1);
                            } else if (obj.type === 'destructible') {
                                obj.active = false; obj.respawnTimer = 600; 
                                syncMap();
                                npc.cratesSmashed++; npc.score += 50;
                                let r = Math.random();
                                if (r < 0.17) npc.health = Math.min(100, npc.health + Math.floor(Math.random() * 6) + 10);
                                else if (r < 0.25) { npc.speed *= 1.1; npc.accel *= 1.1; }
                            } else if (obj.type === 'indestructible') {
                                npc.x += (dx / dist) * 2; npc.y += (dy / dist) * 2;
                                npc.vx *= -0.5; npc.vy *= -0.5;
                                npc.angle += Math.PI; npc.targetAngle = npc.angle;
                                npc.health = Math.max(0, npc.health - 7);
                            }
                        }
                    }
                }
            }

            // 3. Player vs Other Players (Everyone evaluates their own bounce)
            if (car.z === 0 && !car.dead) {
                for (let id in otherPlayers) {
                    let op = otherPlayers[id];
                    if (op.z !== 0 || op.dead) continue;
                    let dx = car.x - op.x; let dy = car.y - op.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist < car.radius + (op.radius || 14)) {
                        let playerSpeed = Math.hypot(car.vx, car.vy);
                        let opSpeed = Math.hypot(op.vx, op.vy);
                        
                        if (playerSpeed >= opSpeed) {
                            car.health = Math.min(100, car.health + 3); car.score += 200;
                            addFloatingText(car.x, car.y - 15, "+200 PTS", "#ffff00");
                            addFloatingText(car.x, car.y, "CRASHED " + op.name + "!", "#00ff00");
                        } else {
                            car.health = Math.max(0, car.health - 2);
                            addFloatingText(car.x, car.y, "-2 HP", "#ff0000");
                        }

                        car.x += (dx / dist) * 3; car.y += (dy / dist) * 3;
                        car.vx *= -0.4; car.vy *= -0.4;
                        playerStats.crashes++;
                        
                        // Small manual separation so we don't trigger collision twice in a row
                        car.x += dx * 0.1; car.y += dy * 0.1;
                    }
                }
            }

            // 4. Player vs NPCs
            if (car.z === 0 && !car.dead) {
                for (let npc of npcs) {
                    if (npc.z !== 0 || npc.dead) continue;
                    let dx = car.x - npc.x; let dy = car.y - npc.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist < car.radius + npc.radius) {
                        let playerSpeed = Math.hypot(car.vx, car.vy);
                        let npcSpeed = Math.hypot(npc.vx, npc.vy);
                        let oldHealth = car.health;
                        
                        // Player resolves their own damage and bounce locally
                        if (playerSpeed >= npcSpeed) {
                            car.health = Math.min(100, car.health + 3); car.score += 200;
                            addFloatingText(car.x, car.y - 15, "+200 PTS", "#ffff00");
                            if (car.health > oldHealth) addFloatingText(car.x, car.y, "+3 HP", "#00ff00");
                        } else {
                            car.health = Math.max(0, car.health - 2);
                            if (car.health < oldHealth) addFloatingText(car.x, car.y, "-2 HP", "#ff0000");
                        }
                        car.x += (dx / dist) * 3; car.y += (dy / dist) * 3;
                        car.vx *= -0.4; car.vy *= -0.4;

                        // Only the Host modifies the NPC's actual health and bounce trajectory
                        if (isHost) {
                            if (playerSpeed >= npcSpeed) npc.health = Math.max(0, npc.health - 2);
                            else { npc.health = Math.min(100, npc.health + 3); npc.score += 200; }
                            npc.x -= (dx / dist) * 3; npc.y -= (dy / dist) * 3;
                            npc.vx *= -0.4; npc.vy *= -0.4;
                            npc.angle += Math.PI / 2; npc.targetAngle = npc.angle;
                        }
                        playerStats.crashes++;
                    }
                }
            }

            // 5. NPC vs NPC Collisions (Host Only)
            if (isHost) {
                for (let i = 0; i < npcs.length; i++) {
                    let npc1 = npcs[i];
                    if (npc1.z !== 0 || npc1.dead) continue;
                    for (let j = i + 1; j < npcs.length; j++) {
                        let npc2 = npcs[j];
                        if (npc2.z !== 0 || npc2.dead) continue;
                        
                        let dx = npc1.x - npc2.x; let dy = npc1.y - npc2.y;
                        let dist = Math.hypot(dx, dy);

                        if (dist < npc1.radius + npc2.radius) {
                            let speed1 = Math.hypot(npc1.vx, npc1.vy); let speed2 = Math.hypot(npc2.vx, npc2.vy);
                            if (speed1 >= speed2) {
                                npc1.health = Math.min(100, npc1.health + 3); npc2.health = Math.max(0, npc2.health - 2); npc1.score += 200;
                            } else {
                                npc2.health = Math.min(100, npc2.health + 3); npc1.health = Math.max(0, npc1.health - 2); npc2.score += 200;
                            }
                            npc1.x += (dx / dist) * 2; npc1.y += (dy / dist) * 2;
                            npc1.vx *= -0.4; npc1.vy *= -0.4; npc1.angle += Math.PI / 2; npc1.targetAngle = npc1.angle;

                            npc2.x -= (dx / dist) * 2; npc2.y -= (dy / dist) * 2;
                            npc2.vx *= -0.4; npc2.vy *= -0.4; npc2.angle += Math.PI / 2; npc2.targetAngle = npc2.angle;
                        }
                    }
                }
            }
        }

        function draw() {
            // Grass Background
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2 - car.x, canvas.height / 2 - car.y);

            // Grid for speed reference
            ctx.fillStyle = '#3e8e41';
            const startX = Math.floor((car.x - canvas.width/2) / 100) * 100;
            const startY = Math.floor((car.y - canvas.height/2) / 100) * 100;
            const endX = startX + canvas.width + 200;
            const endY = startY + canvas.height + 200;

            for(let gx = startX; gx < endX; gx += 100) {
                for(let gy = startY; gy < endY; gy += 100) { ctx.fillRect(gx - 2, gy - 2, 4, 4); }
            }

            // Draw Ground Elements (Puddles) 
            for (let obj of worldObjects) {
                if (!obj.active || obj.type !== 'puddle') continue;
                if (obj.x > car.x + canvas.width/2 + obj.radius || obj.x < car.x - canvas.width/2 - obj.radius ||
                    obj.y > car.y + canvas.height/2 + obj.radius || obj.y < car.y - canvas.height/2 - obj.radius) continue;

                ctx.fillStyle = obj.color;
                ctx.beginPath(); ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2); ctx.fill();
                
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath(); ctx.arc(obj.x - obj.radius * 0.15, obj.y + obj.radius * 0.15, obj.radius * 0.5, 0, Math.PI * 2); ctx.fill();
            }

            // Draw Skid Marks
            for (let sm of skidMarks) {
                if (sm.x1 > car.x + canvas.width/2 + 50 || sm.x1 < car.x - canvas.width/2 - 50 ||
                    sm.y1 > car.y + canvas.height/2 + 50 || sm.y1 < car.y - canvas.height/2 - 50) continue;
                ctx.fillStyle = `rgba(0, 0, 0, ${(sm.life / sm.maxLife) * 0.4})`;
                ctx.fillRect(sm.x1 - 1, sm.y1 - 1, 3, 3); 
                ctx.fillRect(sm.x2 - 1, sm.y2 - 1, 3, 3); 
            }

            // Draw Obstacles 
            for (let obj of worldObjects) {
                if (!obj.active || obj.type === 'puddle') continue;
                if (obj.x > car.x + canvas.width/2 + 50 || obj.x < car.x - canvas.width/2 - 50 ||
                    obj.y > car.y + canvas.height/2 + 50 || obj.y < car.y - canvas.height/2 - 50) continue;

                ctx.fillStyle = obj.color; let size = obj.radius * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(obj.x - obj.radius + 4, obj.y - obj.radius + 4, size, size);
                ctx.fillStyle = obj.color; ctx.fillRect(obj.x - obj.radius, obj.y - obj.radius, size, size);
                ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(obj.x - obj.radius, obj.y - obj.radius, size, size / 4);
                ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(obj.x - obj.radius, obj.y - obj.radius, size, size);
            }

            // Draw NPCs
            for (let npc of npcs) {
                if (npc.dead) continue;
                if (npc.x > car.x + canvas.width/2 + 50 || npc.x < car.x - canvas.width/2 - 50 ||
                    npc.y > car.y + canvas.height/2 + 50 || npc.y < car.y - canvas.height/2 - 50) continue;
                drawCarObject(npc);
            }

            // Draw Other Players
            for (let id in otherPlayers) {
                let op = otherPlayers[id];
                if (op.dead) continue;
                if (op.x > car.x + canvas.width/2 + 50 || op.x < car.x - canvas.width/2 - 50 ||
                    op.y > car.y + canvas.height/2 + 50 || op.y < car.y - canvas.height/2 - 50) continue;
                drawCarObject(op);
            }

            // Draw Player
            if (!car.dead) {
                drawCarObject(car);
            } else {
                ctx.save(); ctx.translate(car.x, car.y); ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#000000";
                ctx.lineWidth = 4; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.font = "bold 48px 'Courier New'"; let seconds = Math.ceil(car.deadTimer / 60);
                ctx.strokeText(seconds, 0, -10); ctx.fillText(seconds, 0, -10);
                ctx.font = "bold 16px 'Courier New'"; ctx.strokeText("RESPAWNING...", 0, 25); ctx.fillText("RESPAWNING...", 0, 25);
                ctx.restore();
            }

            // --- LEADER INDICATOR ARROW ---
            // If the leader is off-screen, mathematically clamp a pointer to the edge of the window
            let allCars = [car, ...Object.values(otherPlayers), ...npcs];
            let leader = allCars.find(c => c.isLeader);

            if (leader && leader !== car && !car.dead) {
                let dx = leader.x - car.x;
                let dy = leader.y - car.y;
                
                let padding = 60; // Distance from the absolute edge of the screen
                let scaleX = (canvas.width / 2 - padding) / Math.abs(dx);
                let scaleY = (canvas.height / 2 - padding) / Math.abs(dy);
                let scale = Math.min(scaleX, scaleY);
                
                // If scale is < 1, it means the target is off-screen (or outside the padding)
                if (scale < 1) {
                    let edgeX = car.x + dx * scale;
                    let edgeY = car.y + dy * scale;
                    let angle = Math.atan2(dy, dx);

                    ctx.save();
                    ctx.translate(edgeX, edgeY);
                    
                    // Add a dynamic pulsing effect to the arrow
                    let pulse = 1 + Math.sin(Date.now() / 150) * 0.15;
                    ctx.scale(pulse, pulse);
                    ctx.rotate(angle);
                    
                    // Draw Golden Arrow Body
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                    ctx.shadowBlur = 6;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;
                    
                    ctx.fillStyle = '#ffeb3b';
                    ctx.beginPath();
                    ctx.moveTo(25, 0);
                    ctx.lineTo(-15, 15);
                    ctx.lineTo(-5, 0);
                    ctx.lineTo(-15, -15);
                    ctx.closePath();
                    ctx.fill();

                    // Draw floating crown icon on the back of the arrow
                    ctx.rotate(-angle); // Un-rotate to draw text upright
                    ctx.font = "24px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("👑", 0, -30);
                    
                    ctx.restore();
                }
            }

            // Draw Particles & Floating Texts
            for (let p of particles) {
                ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            for (let ft of floatingTexts) {
                ctx.save(); ctx.globalAlpha = ft.life / ft.maxLife; 
                ctx.fillStyle = ft.color; ctx.strokeStyle = '#000000'; ctx.lineWidth = 3;
                ctx.font = "bold 20px 'Courier New'"; ctx.textAlign = "center";
                ctx.strokeText(ft.text, ft.x, ft.y); ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        async function setupSync() {
            const mapRef = doc(db, 'artifacts', appId, 'public', 'data', 'world', 'map_state');
            const mapSnap = await getDoc(mapRef);
            
            // Host Election: If map exists, we download it. If not, we generate it and become the Host.
            if (mapSnap.exists()) {
                isHost = false;
                document.getElementById('network-status').innerText = "🌐 CONNECTED";
                document.getElementById('network-status').style.color = "#00ff00";
                let data = mapSnap.data();
                if (data.objects) data.objects.forEach(o => worldObjects.push(o));
            } else {
                isHost = true;
                document.getElementById('network-status').innerText = "🌐 HOST";
                document.getElementById('network-status').style.color = "#ffeb3b";
                initWorld(); 
                await syncMap(); 
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'world', 'npc_state'), { npcs: sanitizeNPCs(npcs) });
            }

            // Sync Listeners
            onSnapshot(mapRef, (snap) => {
                if (snap.exists()) {
                    let data = snap.data();
                    if (data && data.objects) {
                        for(let i = 0; i < worldObjects.length; i++) {
                            if (data.objects[i]) {
                                worldObjects[i].active = data.objects[i].active ?? true;
                                worldObjects[i].respawnTimer = data.objects[i].respawnTimer || 0;
                            }
                        }
                    }
                }
            }, (e) => console.error(e));

            const npcRef = doc(db, 'artifacts', appId, 'public', 'data', 'world', 'npc_state');
            onSnapshot(npcRef, (snap) => {
                if (!isHost && snap.exists()) {
                    lastHostUpdate = Date.now(); // Record host heartbeat
                    let serverNpcs = snap.data().npcs;
                    if (npcs.length === 0) {
                        serverNpcs.forEach(n => npcs.push({...n}));
                    } else {
                        for(let i=0; i<npcs.length; i++) {
                            if (serverNpcs[i]) {
                                // Generate explosions if an NPC died on the server
                                if (!npcs[i].dead && serverNpcs[i].dead) createExplosion(npcs[i].x, npcs[i].y);
                                Object.assign(npcs[i], serverNpcs[i]);
                            }
                        }
                    }
                }
            }, (e) => console.error(e));

            const playersCol = collection(db, 'artifacts', appId, 'public', 'data', 'players');
            onSnapshot(playersCol, (snap) => {
                let now = Date.now();
                snap.forEach(docSnap => {
                    if (docSnap.id !== userId) {
                        let data = docSnap.data();
                        // Prevent "Ghost Players" from haunting the leaderboard
                        if (now - (data.timestamp || 0) < 5000) {
                            otherPlayers[docSnap.id] = data;
                        } else {
                            delete otherPlayers[docSnap.id]; 
                        }
                    }
                });
            }, (e) => console.error(e));

            // Hide loading overlay and kickstart the engine
            document.getElementById('loading').style.display = 'none';
            gameLoop();
        }

        // Start Multiplayer Boot Sequence
        initMultiplayer();
    </script>
</body>
